    <!-- Google Tag Manager (Optimized Lazy Loading on Interaction / Idle / Fallback) -->
    <script>
      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          
          // Remove event listeners once loaded
          window.removeEventListener('scroll', loadGTM, { passive: true });
          window.removeEventListener('mousemove', loadGTM, { passive: true });
          window.removeEventListener('touchstart', loadGTM, { passive: true });
          window.removeEventListener('click', loadGTM, { passive: true });
          
          // Execute Google Tag Manager script
          (function(w,d,s,l,i){
            w[l]=w[l]||[];
            w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
            var f=d.getElementsByTagName(s)[0],j=d.createElement(s);
            j.async=true;
            j.src="https://api.vinicavalcanti.com/6wyopelvelg.js?"+i;
            f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','m=DghYMTgoXTgpWDQ6WjE0SRFRV1hdQxQBWhoMGAUGERkGAAYXAhEZQQQDCA%3D%3D');
        }

        // Add event listeners for early interaction
        window.addEventListener('scroll', loadGTM, { passive: true });
        window.addEventListener('mousemove', loadGTM, { passive: true });
        window.addEventListener('touchstart', loadGTM, { passive: true });
        window.addEventListener('click', loadGTM, { passive: true });

        // Fallback: load GTM after onload + safety timeout or when CPU is idle
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              setTimeout(loadGTM, 3000);
            });
          } else {
            setTimeout(loadGTM, 4000);
          }
        });
      })();
    </script>

    <!-- Dynamic Smart Preload of Critical Hero Images based on pathname -->
    <script>
      (function() {
        var path = window.location.pathname;
        var preloadLink = document.createElement('link');
        preloadLink.rel = 'preload';
        preloadLink.as = 'image';
        preloadLink.fetchPriority = 'high';
        
        if (path.indexOf('retopology-in-topogun-3') !== -1) {
          preloadLink.href = 'https://wp.vinicavalcanti.com/wp-content/uploads/2026/07/topogun-poster-1280x720.webp';
        } else if (path.indexOf('character-design-baby-allosaurus') !== -1) {
          preloadLink.href = 'https://wp.vinicavalcanti.com/wp-content/uploads/2026/07/Cover.webp';
        } else if (path.indexOf('zbrush-for-stylized-characters') !== -1) {
          preloadLink.href = 'https://wp.vinicavalcanti.com/wp-content/uploads/2026/07/1280x720.webp';
        } else {
          preloadLink.href = 'https://wp.vinicavalcanti.com/wp-content/uploads/2026/05/vinicius-cavalcanti-boardinsta01-3.webp';
        }
        
        document.head.appendChild(preloadLink);
      })();
    </script>
